[package]
name = "didi"
version = "0.1.0"
description = "A modern pixel art editor, free and everywhere."
authors = ["Antoine Flouzat"]
license = "GPL-3.0-or-later"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "didi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
# Only in the builds that update themselves (the testers'), see the `updater` feature.
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }

[features]
# The app updates itself: `npm run tauri build -- --features updater --config
# src-tauri/tauri.updater.conf.json`. Not in the store builds, which the stores update.
updater = ["dep:tauri-plugin-updater", "dep:tauri-plugin-process"]

# Native tablet input: WebKitGTK reports the pen as a mouse without pressure,
# so we read GTK events directly from the webview widget.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
